[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irisfs"
version = "0.1.0"
description = "ValhallISC: mount InterSystems IRIS code (classes, routines, ...) as a local filesystem"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "defusedxml>=0.7",
    "mfusepy>=3.1",
    "platformdirs>=4",
    "keyring>=25",
]

[project.optional-dependencies]
gui = [
    "wxPython>=4.2",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]
build = ["pyinstaller>=6", "Pillow>=10"]  # Pillow: scripts/make_icons.py only

[project.scripts]
valhallisc = "irisfs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irisfs = ["gui/icons/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/irisfs"]
exclude = ["src/irisfs/gui/(app|tray|profiles_frame|wxprompter|icons)\\.py"]

[[tool.mypy.overrides]]
module = ["mfusepy", "keyring.*", "wx.*", "AppKit", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "iris: needs the test IRIS container",
    "fuse: needs a working FUSE implementation (real mounts)",
    "gui: needs wxPython and a display",
    "perf: performance tests (PERFNS)",
]
